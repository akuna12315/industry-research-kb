<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>研知 · 行业知识库</title>
  <meta name="description" content="可追溯的行业研究、信息来源管理与智能调查助手">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js?v=20261017-docx" defer></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="研知首页"><span class="brand-icon">研</span><span>研知<small>INDUSTRY ATLAS</small></span></a>
    <div class="workspace-label">我的研究空间 <span>LOCAL</span></div>
    <nav aria-label="主要导航">
      <button class="nav-item" data-view="forestry"><span class="nav-icon">♧</span>林草工作台</button>
      <button class="nav-item" data-view="materials"><span class="nav-icon">▥</span>专业资料</button>
      <button class="nav-item active" data-view="evidence"><span class="nav-icon">▤</span>证据库<span id="nav-count" class="count">0</span></button>
      <button class="nav-item" data-view="industries"><span class="nav-icon">◫</span>行业与范围</button>
      <button class="nav-item" data-view="sources"><span class="nav-icon">⌁</span>信息来源</button>
      <button class="nav-item" data-view="websearch"><span class="nav-icon">⌕</span>网页搜索</button>
      <button class="nav-item" data-view="crawls"><span class="nav-icon">↧</span>批量采集</button>
      <button class="nav-item" data-view="review"><span class="nav-icon">◷</span>待复核<span id="review-count" class="count">0</span></button>
      <button class="nav-item" data-view="reports"><span class="nav-icon">▧</span>报告与记录</button>
      <button class="nav-item" data-view="memory"><span class="nav-icon">◇</span>记忆与对话</button>
    </nav>
    <div class="sidebar-note"><span class="note-mark">↗</span><strong>让研究有据可循</strong><p>每条事实保留来源、核验日期和修改历史。</p></div>
    <div class="sidebar-bottom"><button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Agent 设置</button><div class="local-status"><span class="dot"></span>本地知识库 <span id="server-date"></span></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="breadcrumb">研究空间 <span>/</span> <strong id="breadcrumb">证据库</strong></div><div class="topbar-right"><label for="industry-select">浏览范围</label><select id="industry-select"><option value="all">全部行业档案</option></select><button class="icon-button" id="refresh" title="刷新资料" aria-label="刷新资料">↻</button><button class="mobile-agent" id="show-agent">Agent</button></div></header>
    <div class="content" id="content" aria-live="polite"></div>
    <footer class="main-footer"><span>研知 / Industry Atlas</span><span>公开来源 · 可追溯证据 · 本地归档</span></footer>
  </main>
  <aside class="agent-panel" id="agent-panel">
    <div class="agent-header"><span class="agent-avatar">✳</span><div><strong>研究助手</strong><small>PydanticAI · 开源 Agent</small></div><button id="new-chat" class="icon-button" title="新对话" aria-label="新对话">＋</button></div>
    <div class="agent-model"><span class="dot"></span><span id="model-name">连接模型</span><button id="agent-settings" aria-label="打开模型设置">↗</button></div>
    <div class="chat-log" id="chat-log"><div class="agent-welcome"><div class="welcome-spark">✳</div><h2>从一个好问题开始</h2><p>我会先查知识库，再追到原始来源。你可以让我比较证据、检查旧资料，或整理一份简报。</p><button class="prompt-chip" data-prompt="概括现有证据，列出原始链接、核验日期和调查缺口。">概括现有证据 <span>↗</span></button><button class="prompt-chip" data-prompt="哪些资料需要重新核验？说明时效与事实状态的区别。">检查资料时效 <span>↗</span></button><button class="prompt-chip" data-prompt="为当前范围生成一份带来源、日期和限制的证据简报。">生成证据简报 <span>↗</span></button></div></div>
    <form id="chat-form" class="chat-compose"><div class="chat-mode"><label><input id="research-mode" type="checkbox">研究并归档</label><span id="chat-scope">全部档案 · 只读</span></div><label class="source-permission"><input id="source-changes" type="checkbox">允许按我的要求添加信源</label><textarea id="chat-input" rows="3" placeholder="提出问题，或指定调查方向…" aria-label="发给研究助手的问题"></textarea><div class="compose-bottom"><span>Shift + Enter 换行</span><button id="stop-agent" type="button" class="stop-button" hidden>停止</button><button id="send-agent" type="submit" class="send-button" aria-label="发送问题">↑</button></div></form>
    <div class="agent-footnote">依据来自工具结果；缺少证据时保留问题。</div>
  </aside>
</div>
<dialog id="dialog"><div class="dialog-header"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
